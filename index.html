<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Log - Daily Check-in</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 Daily Mood Log</h1>
            <p class="subtitle">Track your emotional wellbeing</p>
        </header>

        <form id="moodForm">
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="name">Name (optional):</label>
                <input type="text" id="name" name="name" placeholder="Your name">
            </div>

            <div class="form-group">
                <label>How are you feeling today?</label>
                <div class="mood-options">
                    <label class="mood-option">
                        <input type="radio" name="mood" value="Very Happy" required>
                        <span class="emoji">😄</span>
                        <span>Very Happy</span>
                    </label>
                    <label class="mood-option">
                        <input type="radio" name="mood" value="Happy" required>
                        <span class="emoji">😊</span>
                        <span>Happy</span>
                    </label>
                    <label class="mood-option">
                        <input type="radio" name="mood" value="Neutral" required>
                        <span class="emoji">😐</span>
                        <span>Neutral</span>
                    </label>
                    <label class="mood-option">
                        <input type="radio" name="mood" value="Sad" required>
                        <span class="emoji">😢</span>
                        <span>Sad</span>
                    </label>
                    <label class="mood-option">
                        <input type="radio" name="mood" value="Very Sad" required>
                        <span class="emoji">😭</span>
                        <span>Very Sad</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="energy">Energy Level (1-10):</label>
                <input type="range" id="energy" name="energy" min="1" max="10" value="5" required>
                <span id="energyValue">5</span>
            </div>

            <div class="form-group">
                <label for="sleep">Hours of Sleep:</label>
                <input type="number" id="sleep" name="sleep" min="0" max="24" step="0.5" placeholder="7.5" required>
            </div>

            <div class="form-group">
                <label for="stress">Stress Level (1-10):</label>
                <input type="range" id="stress" name="stress" min="1" max="10" value="5" required>
                <span id="stressValue">5</span>
            </div>

            <div class="form-group">
                <label for="activities">Activities today (select all that apply):</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="activities" value="Exercise"> Exercise
                    </label>
                    <label>
                        <input type="checkbox" name="activities" value="Meditation"> Meditation
                    </label>
                    <label>
                        <input type="checkbox" name="activities" value="Social"> Social Time
                    </label>
                    <label>
                        <input type="checkbox" name="activities" value="Work"> Work
                    </label>
                    <label>
                        <input type="checkbox" name="activities" value="Hobbies"> Hobbies
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Additional Notes:</label>
                <textarea id="notes" name="notes" rows="4" placeholder="How was your day? Any thoughts to share?"></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Mood Log</button>
        </form>

        <div id="message" class="message"></div>

        <footer>
            <p class="info-text">
                📊 Your mood data is stored in a Google Sheet for personal tracking.
            </p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
